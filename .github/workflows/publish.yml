name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for GITHUB_TOKEN to push to the registry.
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that points @aether-zone at GitHub Packages and
          # authenticates it with NODE_AUTH_TOKEN.
          registry-url: https://npm.pkg.github.com
          scope: '@aether-zone'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publishing an unbuilt package would ship an empty dist.
      - name: Build packages
        run: pnpm build

      - name: Verify the tarball has its stylesheets
        run: |
          cd packages/react
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar tzf "$RUNNER_TEMP"/aether-zone-kosmos-*.tgz | tee /dev/stderr \
            | grep -q 'package/dist/styles.css'

      - name: Publish
        run: pnpm --filter @aether-zone/kosmos publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
